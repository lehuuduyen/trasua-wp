
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Phiếu In 80x80</title>

  <style type="text/css">
    * {
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
      box-sizing: border-box;
    }

    body {
      font-family: "Arial";
    }

    @media print {
      @page {
        size: 80mm 80mm;
        margin-top: 0;
        margin-right: 1rem;
        margin-bottom: 0;
        margin-left: 0;
        min-height: auto;
      }
      html,
      .content {
        width: 80mm;
        height: 85mm;
        content: ".";
      }
    }
    .content.page-break {
      display: block;
      page-break-after: always;
    }
    .content {
      width: 80mm;
      height: 85mm;
      background-color: white;
      position: relative;
      margin: 4px;
    }
    .line-clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
    .line-clamp-4 {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }
    .line-clamp-5 {
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
    }
    .line-clamp-6 {
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
    }
    .module {
      overflow: hidden;
    }
    .line {
      line-height: 12px;
    }
    .items :last-child {
      border-bottom: 1px dotted;
    }
    #process-bar {
      margin:auto;
      position: fixed;
      z-index: 1000;
      width: 98%;
      height: 8px;
      top:  50%;
      left: 50%;
      transform: translate(-50%,-50%);
    }
    .w3-light-grey,
    .w3-hover-light-grey:hover,
    .w3-light-gray,
    .w3-hover-light-gray:hover {
      color: #000 !important;
      background-color: #f1f1f1 !important;
    }
    .w3-round,
    .w3-round-medium {
      border-radius: 4px;
    }
    .w3-round-large {
      border-radius: 8px;
    }
    .w3-green,
    .w3-hover-green:hover {
      color: #ff8328 !important;
      background-color: #ff8328 !important;
      height: 8px;
      font-size: 1px;
    }
  </style>
</head>

<div id="process-bar" class="w3-light-grey w3-round">
  <div id="myBar" class="w3-container w3-green w3-round-large" style="width: 0%">background</div>
  <div
          id="value-percent"
          style="text-align: center; font-size: 12px; margin-top: 2px; color: #ff8328; font-weight: bold"
  >
    Đang tải 0%
  </div>
</div>

<script>
  function processBar(stt, total) {
    elem = document.getElementById("myBar")
    value = document.getElementById("value-percent")
    if (elem) {
      if (stt == total) {
        elem.style.width = 100 + "%"
        value.innerHTML = "Đã tải " + 100 + "%"
        document.getElementById("process-bar").remove()

        window.print()
      } else {
        width = ((stt / total) * 100).toFixed(0)
        elem.style.width = width + "%"
        value.innerHTML = "Đang tải " + width * 1 + "%"
      }
    }
  }
</script>

<div class="content page-break line" style="font-weight: bold; position: relative">

        </div>

    </div>

    <div style="padding-left: 4px; width: 65%">

        <div>******5678</div>
      </div>
      <div class="module line-clamp-2">Hà Nội</div>
    </div>
  </div>
  <div style="padding: 2px; border-bottom: 1px dotted">
    <img
            width="100%"

            src="https://online-gateway.ghn.vn/barcode/api/v1/barcode/generate?code=LLUBV4&type=128A&width=820&height=150"

  <div

    Xã An Thới Đông, Huyện Cần Giờ

  <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dotted">
